<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solid 3D Gnarl Studio</title>
<style>
:root{--bg:#0b0c12;--panel:#12141d;--line:#252839;--tx:#d7daea;--dim:#7d83a0;--ac:#f5a524;--ac2:#4fd1c5}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100%}
#side{width:320px;min-width:320px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#side header{padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}#ver{color:var(--dim);font-size:11px;margin-left:6px}
#ui{flex:1;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;color:var(--dim);padding:8px 4px;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.panes{flex:1;overflow:auto;padding:8px 12px 24px}.pane{display:none}.pane.on{display:block}
.hide{display:none!important}
.head{margin:14px 0 4px;color:var(--ac2);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.info{color:var(--dim);font-size:12px;margin:4px 0 8px}
.row.s,.row.select,.row.color{display:grid;grid-template-columns:1fr 22px 52px;align-items:center;column-gap:6px;margin:3px 0}
.row.s label,.row.select label,.row.color label{grid-column:1}
.row.s input[type=range]{grid-column:1/3;width:100%}.row.s .val{grid-column:3;text-align:right;color:var(--ac);font-variant-numeric:tabular-nums}
.row.select select{grid-column:1/4;width:100%}.row.color input{grid-column:3}
.rst{background:none;border:0;color:var(--dim);cursor:pointer;padding:0}.rst:hover{color:var(--ac)}.rst.dim{opacity:.25}
select,input[type=number]{background:#1a1d2a;color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:4px}
input[type=range]{accent-color:var(--ac)}
.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.pal{height:26px;border:2px solid transparent;border-radius:5px;cursor:pointer}.pal.on{border-color:#fff}
.btn,#bar button,.seg button,.mrow button,.preset{background:#1a1d2a;border:1px solid var(--line);color:var(--tx);border-radius:5px;padding:6px 10px;cursor:pointer}
.btn:hover,#bar button:hover,.preset:hover,.seg button:hover{border-color:var(--ac)}
.primary{background:var(--ac)!important;color:#111!important;border-color:var(--ac)!important;font-weight:600}
.seg{display:flex;margin-top:6px}.seg button{flex:1;border-radius:0}.seg .on{background:var(--ac2);color:#111}
.plist{display:grid;gap:5px}.preset{text-align:left}.preset.on{border-color:var(--ac);color:var(--ac)}
.row.files .btn,.row.image .btn{margin:2px 4px 2px 0}
#stage{position:relative;flex:1;min-width:0}#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;left:10px;top:8px;color:#fff8;font:11px monospace;pointer-events:none}
#err{position:absolute;inset:20px;background:#300c;border:1px solid #f55;padding:12px;white-space:pre-wrap;font:12px monospace;overflow:auto}
#bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:#0009;padding:6px;border-radius:9px;backdrop-filter:blur(8px)}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:420px;max-width:92vw}
.card h3{margin:0 0 10px}.resrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.resrow button{background:#1a1d2a;color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:5px 8px;cursor:pointer}.resrow .on{border-color:var(--ac);color:var(--ac)}
.wh{display:flex;gap:10px}.wh label{flex:1}.wh input{width:100%;margin-top:3px}
.note{color:var(--dim);font-size:12px}.prog{height:6px;background:#1a1d2a;border-radius:3px;overflow:hidden;margin:8px 0}#progBar{height:100%;width:0;background:var(--ac)}
.mrow{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:760px){#app{flex-direction:column-reverse;height:100vh;height:100dvh}#side{width:100%;min-width:0;height:auto;flex:1 1 0;min-height:0;border-right:0;border-top:1px solid var(--line)}#stage{height:52%;flex:none}
  /* tabs go straight under the viewer: drop the title bar on phones */
  #side header{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;padding:11px 12px;font-size:13px}
  .panes{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  #credit{padding:5px 14px}
  /* toolbar: one row that scrolls sideways instead of overflowing the screen */
  #bar{left:8px;right:8px;transform:none;bottom:8px;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;padding:5px}
  #bar::-webkit-scrollbar{display:none}#bar button{flex:none;padding:5px 9px;font-size:12px}
  #hud{font-size:10px;right:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media(pointer:coarse){
  input[type=range]{height:28px}
  .rst{min-width:30px;min-height:30px;font-size:15px}
  .row.s,.row.select,.row.color{grid-template-columns:1fr 30px 52px;margin:6px 0}
  select{min-height:36px}
  .btn,.preset,.seg button{min-height:38px}
  .pal{height:34px}
}

#credit{padding:7px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;text-align:center}
#vmodal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9}
#vmodal .card{width:520px;max-height:94vh;overflow:auto}.hide{display:none!important}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-bottom:8px}.vgrid label{display:flex;flex-direction:column;font-size:12px;color:var(--dim)}
.vgrid input,.vgrid select{margin-top:3px;background:#12141d;color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:5px}.vgrid .chk{flex-direction:row;align-items:center;gap:6px;grid-column:1/-1}.vgrid .chk input{margin:0}
#vPrev{height:140px;width:auto;max-width:100%;margin:6px auto!important;aspect-ratio:auto;background:#07080c;border-radius:6px;display:block;margin:6px 0}#vBar{height:100%;width:0;background:var(--ac)}

</style>
</head>
<body>
<div id="app">
  <aside id="side"><header><b>Gnarl Studio</b> <span id="ver"></span></header><div id="ui"></div><footer id="credit">Created with help from Claude AI</footer></aside>
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <div id="err" class="hide"></div>
    <div id="bar">
      <button id="bPlay" title="Pause / play animation">⏸</button>
      <button id="bCam" title="Reset camera">⌖ Camera</button>
      <button id="bRand" title="Random seed + jitter">🎲 Reseed</button>
      <button id="bSnap" title="Save viewer PNG">📷 Snapshot</button>
      <button id="bRec" title="Record the live viewer to WebM">⏺ Record</button>
      <button id="bVid" title="Render a deterministic video (MP4)">🎬 Video</button>
      <button id="bHQ" class="primary">HQ export</button>
    </div>
  </main>
</div>
<div id="modal" class="hide"><div class="card">
  <h3>HQ export</h3>
  <div class="resrow" id="resBtns"></div>
  <div class="wh"><label>Width <input id="hqW" type="number" min="64" max="8192" step="1"></label><label>Height <input id="hqH" type="number" min="64" max="8192" step="1"></label></div>
  <p class="note" id="hqNote"></p>
  <div class="prog"><div id="progBar"></div></div>
  <div class="mrow"><button id="hqGo" class="primary">Render PNG</button><button id="hqCancel">Close</button></div>
</div></div>
<div id="vmodal" class="hide"><div class="card">
  <h3>Video export</h3>
  <div class="resrow" id="vRes"></div>
  <div class="vgrid" id="vForm"></div>
  <canvas id="vPrev" width="320" height="180"></canvas>
  <p class="note" id="vNote"></p>
  <div class="prog"><div id="vBar"></div></div>
  <div class="mrow"><button id="vGo" class="primary">Render video</button><button id="vCancel">Close</button></div>
</div></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<script>
(() => {
  // engine/state.js
  var VERSION = "1.5.0";
  var DEFAULTS = Object.freeze({
    // shape
    fold: 0,
    iters: 4,
    scale: 1.4,
    offx: 0.8,
    offy: 0.8,
    offz: 0.8,
    rx: 0,
    ry: 0,
    rz: 0,
    fx1: 3.5,
    fy1: 3.5,
    fx2: 2,
    fy2: 2,
    gmode: 1,
    sym: 0,
    plane: 0,
    planedepth: 2,
    mirror: 0,
    seed: 0,
    jitter: 0.6,
    eyecell: 2,
    eyedepth: 4,
    eyespin: 1.5,
    eyesq: 2.5,
    scrtile: 2,
    scrroll: 3,
    scrwave: 1.2,
    mpetals: 6,
    mflat: 0.18,
    meyeblend: 0.6,
    spiral: 0.6,
    twidth: 0.2,
    warp: 0,
    // march
    steps: 128,
    eps: 1e-3,
    detail: 1,
    stepscale: 0.9,
    safe: 1,
    // light
    laz: 0.8,
    lel: 1.2,
    lint: 1.5,
    l2az: 2.2,
    l2el: 0.5,
    l2int: 0.25,
    fill: 0.12,
    sky: 0.4,
    rim: 0.15,
    shadows: 1,
    soft: 12,
    ao: 0.6,
    aor: 0.5,
    orbitLight: 0,
    lightFollow: 1,
    fog: 0.08,
    // material / colour
    pal: 4,
    ccyc: 2.5,
    cshift: 0,
    spec: 0.8,
    rough: 0.4,
    metal: 0,
    sss: 0.2,
    glow: 0.35,
    c0: "#1b1b3a",
    c1: "#c0392b",
    c2: "#f39c12",
    c3: "#fdf2c0",
    bg0: "#02020a",
    bg1: "#0a0a22",
    // image
    useimg: 0,
    imgblend: 1,
    imgscale: 1,
    imgrow: 0.5,
    // post
    tonemap: 0,
    exposure: 1,
    contrast: 1,
    sat: 1,
    vig: 0,
    grain: 0.2,
    // animation
    anim: 1,
    animSpeed: 0.3,
    autoRot: 0,
    rotMode: 0,
    rotRange: 0.6,
    drift: 0,
    driftSpeed: 0.15,
    // camera
    camTheta: 0.4,
    camPhi: 0.35,
    camDist: 4.5,
    camFov: 1.05,
    tx: 0,
    ty: 0,
    tz: 0,
    ortho: 0,
    orthoScale: 3,
    // viewer / export
    viewScale: 1,
    viewAA: 16,
    liveAA: 1,
    hqW: 2560,
    hqH: 1440,
    hqSteps: 400,
    hqAA: 2,
    vidW: 1920,
    vidH: 1080,
    vidFps: 30,
    vidDur: 8,
    vidMode: 0,
    vidLoop: 1,
    vidSpeed: 1,
    vidTurns: 1,
    vidDolly: 1,
    vidQ: 2,
    vidAA: 2,
    vidSteps: 200,
    vidFmt: 0
  });
  function makeState(over = {}) {
    return { ...DEFAULTS, ...over };
  }
  function followLight(e, S2) {
    if (!S2.lightFollow) return e;
    const d = e.camTheta - S2.camTheta;
    e.laz = S2.laz - d;
    e.l2az = S2.l2az - d;
    return e;
  }
  function applyRot(e, S2, phase) {
    const m = S2.rotMode || (S2.fold >= 6 ? 1 : 2);
    if (m === 1) e.camTheta = S2.camTheta + S2.rotRange * Math.sin(phase);
    else if (m === 3) e.rz = S2.rz + phase;
    else e.camTheta = S2.camTheta + phase;
    return e;
  }
  function effective(S2, t) {
    const e = { ...S2, time: t };
    if (S2.autoRot) applyRot(e, S2, t * 0.35);
    if (S2.drift) {
      const k = t * S2.driftSpeed * 6.28318 * 0.25, a = S2.drift;
      const df = Math.min(1, Math.sqrt(4 / Math.pow(Math.max(S2.scale, 1), S2.iters)));
      e.offx += 0.35 * a * df * Math.sin(k * 1 + 0.3);
      e.offy += 0.35 * a * df * Math.sin(k * 1.3 + 1.7);
      e.offz += 0.35 * a * df * Math.sin(k * 0.8 + 2.9);
      e.fx1 += 0.5 * a * Math.sin(k * 0.7 + 0.9);
      e.fy1 += 0.5 * a * Math.sin(k * 0.9 + 2.1);
      e.fx2 += 0.3 * a * Math.sin(k * 1.1 + 4);
      e.fy2 += 0.3 * a * Math.sin(k * 0.6 + 5.2);
    }
    return followLight(e, S2);
  }
  function camPos(e) {
    const t = e.camTheta, p = e.camPhi, d = e.camDist;
    return [d * Math.cos(p) * Math.sin(t) + e.tx, d * Math.sin(p) + e.ty, d * Math.cos(p) * Math.cos(t) + e.tz];
  }
  function serialize(S2) {
    const o = {};
    for (const k of Object.keys(DEFAULTS)) o[k] = S2[k];
    return JSON.stringify({ app: "gnarl-studio", version: VERSION, state: o }, null, 1);
  }
  function deserialize(txt) {
    const j = JSON.parse(txt);
    const src = j.state || j;
    const o = {};
    for (const k of Object.keys(DEFAULTS)) if (k in src && typeof src[k] === typeof DEFAULTS[k]) o[k] = src[k];
    return makeState(o);
  }

  // engine/uniforms.js
  var FLOATS = [
    "scale",
    "offx",
    "offy",
    "offz",
    "rx",
    "ry",
    "rz",
    "fx1",
    "fy1",
    "fx2",
    "fy2",
    "planedepth",
    "seed",
    "jitter",
    "eyecell",
    "eyedepth",
    "eyespin",
    "eyesq",
    "scrtile",
    "scrroll",
    "scrwave",
    "mpetals",
    "mflat",
    "meyeblend",
    "eps",
    "detail",
    "stepscale",
    "laz",
    "lel",
    "lint",
    "l2az",
    "l2el",
    "l2int",
    "fill",
    "sky",
    "rim",
    "soft",
    "ao",
    "aor",
    "fog",
    "ccyc",
    "cshift",
    "spec",
    "rough",
    "metal",
    "sss",
    "glow",
    "imgblend",
    "imgscale",
    "imgrow",
    "imgaspect",
    "exposure",
    "contrast",
    "sat",
    "vig",
    "grain",
    "camFov",
    "orthoScale",
    "safe",
    "spiral",
    "twidth",
    "warp",
    "time"
  ];
  var INTS = ["iters", "gmode", "sym", "mirror", "steps", "shadows", "orbitLight", "pal", "useimg", "tonemap", "anim", "ortho"];
  var COLORS = ["c0", "c1", "c2", "c3", "bg0", "bg1"];
  var hex3 = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
  var lin3 = (h) => hex3(h).map((v) => Math.pow(v, 2.2));

  // engine/variations/gnarly.js
  var gnarly_default = { id: 0, name: "Gnarly", desc: "Nested cos/sin triaxial fold, 8 trig-nest modes. The original JWildfire gnarl engine.", glsl: `
vec2 de_var(vec3 pos){
  float at=ANIM?u_time:0.0;
  float fx1=u_fx1+0.3*sin(at*0.41), fy1=u_fy1+0.3*cos(at*0.37);
  float fx2=u_fx2+0.2*sin(at*0.53), fy2=u_fy2+0.2*cos(at*0.29);
  mat3 R=rX(u_rx)*rY(u_ry+at*0.07)*rZ(u_rz);
  // Lipschitz bound of the warp: per-iteration stretch = |scale| + |off|*grad(w)
  float Gm=(u_gmode==4)?2.0:((u_gmode==6)?6.0:1.0);
  float G=(fx1+fx2*(1.0+fx1))*Gm;
  float fac=abs(u_scale)+clamp(u_safe,0.0,1.0)*max(abs(u_offx),max(abs(u_offy),abs(u_offz)))*G*0.06;
  vec3 z=pos; float dr=1.0,trap=1e9;
  for(int i=0;i<20;i++){ if(i>=u_iters) break; z=R*z;
    float wx,wy,wz;
    if(u_gmode==1){ wx=cos(fx1*z.y+sin(fx2*(z.y+sin(fx1*z.z)))); wy=cos(fy1*z.x+sin(fy2*(z.x+sin(fy1*z.z)))); wz=cos(fx1*z.z+sin(fx2*(z.z+sin(fy1*z.x)))); }
    else if(u_gmode==2){ wx=sin(fx1*z.y+sin(fx2*(z.y+cos(fx1*z.z)))); wy=sin(fy1*z.x+sin(fy2*(z.x+cos(fy1*z.z)))); wz=sin(fx1*z.z+sin(fx2*(z.z+cos(fy1*z.x)))); }
    else if(u_gmode==3){ wx=cos(fx1*z.y+sin(fx2*(z.x+sin(fx1*z.z)))); wy=cos(fy1*z.x+sin(fy2*(z.y+sin(fy1*z.z)))); wz=cos(fx1*z.z+sin(fx2*(z.z+sin(fy1*z.y)))); }
    else if(u_gmode==4){ float sq=fx2*(z.y+cos(fx1*z.z)); sq*=sq; wx=sin(fx1*z.y+sin(sq)); sq=fy2*(z.x+cos(fy1*z.z)); sq*=sq; wy=sin(fy1*z.x+sin(sq)); sq=fx2*(z.z+cos(fy1*z.x)); sq*=sq; wz=sin(fx1*z.z+sin(sq)); }
    else if(u_gmode==5){ wx=cos(fx1*z.y+log(abs(fx2*(z.y+sin(fx1*z.z)))+1.0)); wy=cos(fy1*z.x+log(abs(fy2*(z.x+sin(fy1*z.z)))+1.0)); wz=cos(fx1*z.z+log(abs(fx2*(z.z+sin(fy1*z.x)))+1.0)); }
    else if(u_gmode==6){ wx=cos(fx1*z.y+tan(clamp(fx2*(z.y+sin(fx1*z.z)),-1.5,1.5))); wy=cos(fy1*z.x+tan(clamp(fy2*(z.x+sin(fy1*z.z)),-1.5,1.5))); wz=cos(fx1*z.z+tan(clamp(fx2*(z.z+sin(fy1*z.x)),-1.5,1.5))); }
    else if(u_gmode==7){ wx=sin(fx1*z.y+atan(fx2*z.z)); wy=cos(fy1*z.z+atan(fy2*z.x)); wz=sin(fx1*z.x+atan(fx2*z.y)); }
    else { wx=sin(fx1*z.y)*cos(fx2*z.z); wy=sin(fy1*z.z)*cos(fy2*z.x); wz=sin(fx1*z.x)*cos(fx2*z.y); }
    z=z*u_scale+u_off*vec3(wx,wy,wz); dr=dr*fac+1.0;
    trap=min(trap,dot(z,z)); if(length(z)>10.0) break;
  }
  return vec2((length(z)-1.5)/max(abs(dr),0.001), trap);
}` };

  // engine/variations/sine.js
  var sine_default = { id: 1, name: "Sine Warp", desc: "Recursive sin(sin(z)) iteration: flowing folds and tendrils.", glsl: `
vec2 de_var(vec3 pos){
  float at=ANIM?u_time*0.12:0.0;
  mat3 R=rX(u_rx)*rY(u_ry+at*0.05)*rZ(u_rz);
  float fac=abs(u_scale)*(1.0+clamp(u_safe,0.0,1.0)*(max(abs(u_fx1),abs(u_fy1))+max(abs(u_fx2),abs(u_fy2)))*0.5);
  vec3 z=pos; float dr=1.0,trap=1e9;
  for(int i=0;i<20;i++){ if(i>=u_iters) break; z=R*z;
    z=sin(z*vec3(u_fx1,u_fy1,u_fx1)+sin(z.yzx*vec3(u_fx2,u_fy2,u_fx2)+at*0.18));
    z=z*u_scale+u_off*0.45; dr=dr*fac+1.0;
    trap=min(trap,length(z)); if(length(z)>6.0) break;
  }
  return vec2((length(z)-1.2)/max(abs(dr),0.001), trap);
}` };

  // engine/variations/fbm.js
  var fbm_default = { id: 2, name: "FBM Warp", desc: "Stacked 3D value-noise displacement: cloud-like organic drift.", glsl: `
vec2 de_var(vec3 pos){
  float at=ANIM?u_time*0.07:0.0;
  mat3 R=rX(u_rx)*rY(u_ry+at*0.04)*rZ(u_rz);
  float mf=max(abs(u_fx1),max(abs(u_fx2),abs(u_fy1)))*max(1.0,abs(u_fy2)*0.5);
  float fac=abs(u_scale)*(1.0+clamp(u_safe,0.0,1.0)*0.6*max(abs(u_offx),max(abs(u_offy),abs(u_offz)))*mf);
  vec3 z=pos; float dr=1.0,trap=1e9;
  for(int i=0;i<20;i++){ if(i>=u_iters) break; z=R*z;
    float f1=fbm3(z*u_fx1+vec3(at*0.1,0.0,0.0),4)-0.5;
    float f2=fbm3(z*u_fx2+vec3(0.0,at*0.1,at*0.08),4)-0.5;
    float f3=fbm3(z*u_fy1+vec3(0.0,0.0,at*0.09),4)-0.5;
    z+=vec3(f1,f2,f3*(u_fy2*0.5))*u_off*0.6; z=z*u_scale;
    dr=dr*fac+1.0; trap=min(trap,length(z)); if(length(z)>6.0) break;
  }
  return vec2((length(z)-1.2)/max(abs(dr),0.001), trap);
}` };

    const clock = !paused && (S.anim || S.autoRot || S.drift || S.orbitLight);
    if (clock) {
      S.t += dt * S.animSpeed;
      dirty = true;
    }
    const interacting = !recTrack && (ptrs.size > 0 || now - lastInteract < 180);
    if (interacting !== wasInteracting) {
      wasInteracting = interacting;
      dirty = true;
    }
    if (!dirty) {
      if (!clock && !interacting && acc > 0 && acc < S.viewAA) {
        try {
          refineStep();
        } catch (e) {
          showErr(e);
        }
      }
      return;
    }
    dirty = false;
    try {
      const { w, h } = viewSize(interacting);
      renderFrame(w, h);
      if (clock && !interacting) for (let i = 1; i < S.liveAA; i++) refineStep();
      if (recTrack && recTrack.requestFrame) recTrack.requestFrame();
    } catch (e) {
      showErr(e);
    }
  }
  new ResizeObserver(markDirty).observe(canvas);
  renderer.onRestored = () => {
    tryCompile();
    markDirty();
  };
  requestAnimationFrame(frame);
  var RES2 = [["1080p", 1920, 1080], ["1440p", 2560, 1440], ["4K", 3840, 2160], ["5K", 5120, 2880], ["Square 2K", 2048, 2048], ["Square 4K", 4096, 4096], ["8K", 7680, 4320]];
  var cancelled = false;
  function openModal() {
    $("modal").classList.remove("hide");
    $("hqW").value = S.hqW;
    $("hqH").value = S.hqH;
    noteUpdate();
    const box2 = $("resBtns");
    box2.innerHTML = "";
    RES2.forEach(([n, w, h]) => {
      const b = document.createElement("button");
      b.textContent = n;
      b.onclick = () => {
        $("hqW").value = w;
        $("hqH").value = h;
        noteUpdate();
      };
      box2.append(b);
    });
  }
  function dims() {
    const m = renderer.maxDim();
    return { W: clamp(parseInt($("hqW").value) || 1920, 64, m), H: clamp(parseInt($("hqH").value) || 1080, 64, m) };
  }
  function noteUpdate() {
    const { W, H } = dims(), n = S.hqAA * S.hqAA;
    $("hqNote").textContent = W + "\xD7" + H + " \xB7 " + n + " samples/pixel \xB7 " + S.hqSteps + " march steps. Renders in tiles through the same shader as the viewer; frame " + (S.t || 0).toFixed(2) + "s is frozen.";
  }
  $("hqW").oninput = $("hqH").oninput = noteUpdate;
  $("bHQ").onclick = openModal;
  $("hqCancel").onclick = () => {
    cancelled = true;
    if (!busy) $("modal").classList.add("hide");
  };
  $("hqGo").onclick = async () => {
    if (busy) return;
    const { W, H } = dims();
    S.hqW = W;
    S.hqH = H;
    busy = true;
    cancelled = false;
    $("hqGo").disabled = true;
    $("progBar").style.width = "0";
    const e = effective(S, S.t || 0);
    try {
      const t0 = performance.now();
      const img = await exportImage(
        renderer,
        e,
        { W, H, aa: S.hqAA, steps: S.hqSteps, tile: 256 },
        { cancelled: () => cancelled, progress: (p) => {
          $("progBar").style.width = (p * 100).toFixed(1) + "%";
          $("hqNote").textContent = "Rendering " + Math.round(p * 100) + "% \xB7 " + ((performance.now() - t0) / 1e3).toFixed(0) + "s";
        } }
      );
      if (img) {
        const blob = await toPNGBlob(img);
        download(blob, "gnarl-" + stamp() + "-" + W + "x" + H + "-v" + VERSION + ".png");
        $("hqNote").textContent = "Done in " + ((performance.now() - t0) / 1e3).toFixed(1) + "s.";
      } else $("hqNote").textContent = "Cancelled.";
    } catch (err) {
      showErr(err);
    }
    busy = false;
    $("hqGo").disabled = false;
    markDirty();
    if (cancelled) $("modal").classList.add("hide");
  };
  initVideoUI({ S, renderer, setBusy: (b) => {
    busy = b;
  }, after: markDirty, download, stamp, VERSION });
  window.__gnarl = { TABS, jitter, S, renderer, VARIATIONS, PRESETS, DEFAULTS, effective, exportImage, exportVideo, frameState, frameCount, loadPreset: api.loadPreset, BUILD };
})();

</script>
